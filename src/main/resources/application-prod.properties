# ===============================
# Rocman Candidate Module - PROD
# ===============================
spring.application.name=Rocman Candidate Module
spring.profiles.active=prod

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/rocman_candidate_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.datasource.hikari.auto-commit=false

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=mail.rocman.org
spring.mail.port=587
spring.mail.username=it@rocman.org
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.from=it@rocman.org

# ===============================
# OpenAI / LLM Config
# ===============================
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
openai.api.key=${OPENAI_API_KEY}
openai.api.base-url=https://api.groq.com/openai/v1
openai.api.model=gemma2-9b-it

# ===============================
# Server
# ===============================
server.port=8080
